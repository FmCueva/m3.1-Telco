# Pipeline CI en GitLab — equivalente a .github/workflows/ci.yml para la plataforma del campus.
# El repo vive en gitlab.codecrypto.academy, que NO ejecuta GitHub Actions: el CI real corre AQUÍ.
# El ci.yml de GitHub se conserva como referencia de "cómo son los gates".
#
# Runner del campus: `cloudrun-ephemeral` (el único online; `vps-dind-shared`, con dind, está caído).
# Es executor SHELL sobre Cloud Run (Ubuntu 24.04, Node 22 YA instalado, SIN Docker/dind, SIN
# PostgreSQL como service). Consecuencias:
#   - Todos los jobs llevan el tag `cloudrun` (sin él se quedan en pending: el runner no acepta
#     jobs sin tag).
#   - `image:` y `services:` se IGNORAN en shell → PostgreSQL se instala dentro del job (.postgres).
#   - `docker build` NO funciona (no hay Docker) → el job `docker` queda `allow_failure` mientras la
#     plataforma habilita un runner con Docker/buildah. No penaliza (criterio del profesor).
# Si en el futuro vuelve un runner con image/services, se puede recuperar el patrón image:/services:.

stages: [lint, test, contract, dod, docker]

default:
  tags: [cloudrun]
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - node --version                       # el runner trae Node 22, que es el del proyecto
    - npm ci --cache .npm --prefer-offline

# PostgreSQL real dentro del job (el runner shell ignora `services:`).
.postgres:
  variables:
    DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-16 > /dev/null
    - pg_ctlcluster 16 main start
    - su postgres -c "psql -q -c \"ALTER USER postgres PASSWORD 'test'\""
    - node --version
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm audit --audit-level=high         # SCA: cero HIGH/CRITICAL conocidas
    - npm run lint                         # eslint + prettier --check
    - npx depcruise src --validate         # fronteras de módulos (ADR-001)

test:
  stage: test
  needs: [lint]
  script:
    - npm run test:unit -- --coverage
    - npx tsx scripts/coverage-gate.ts 80  # gate de cobertura >= 80 %
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths: [coverage/]

contract:
  stage: contract
  extends: .postgres
  needs: [test]
  script:
    - npm run migrate && npm run test:contract
    - npm run test:e2e                     # punta de la pirámide: flujo feliz completo

dod:
  stage: dod
  needs: [contract]
  variables:
    PR_TITLE: $CI_MERGE_REQUEST_TITLE      # vía variable: nunca interpolar input no confiable
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        npx tsx scripts/check-dod.ts "$PR_TITLE"
      fi
    - bash scripts/check-ac-coverage.sh    # gate de trazabilidad — cero AC sin test

# El runner cloudrun no tiene Docker: este job fallará ahí (allow_failure → aviso, no rojo).
# Cuando la plataforma habilite un runner con Docker/buildah, quitar `allow_failure`.
docker:
  stage: docker
  needs: [dod]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "merge_request_event"
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
    IMAGE: telco-api:$CI_COMMIT_SHA
  cache: []
  before_script: []
  script:
    - >
      docker build
      --build-arg GIT_SHA=$CI_COMMIT_SHA
      --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      -t "$IMAGE" .
    # Gate de tamaño — presupuesto 250 MB (node:22-alpine ya ~162 MB; 100 MB es inalcanzable con Node).
    - size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
    - echo "imagen $((size / 1024 / 1024)) MB (presupuesto 250 MB)"
    - '[ "$size" -le $((250 * 1024 * 1024)) ]'
    # Trivy — la imagen también cumple su spec: 1 HIGH/CRITICAL = build roto.
    - apk add --no-cache trivy
    - docker save "$IMAGE" -o image.tar
    - trivy image --input image.tar --severity CRITICAL,HIGH --exit-code 1 --no-progress
